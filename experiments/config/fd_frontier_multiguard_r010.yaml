description: "The frontier set at r=0.1 with every state other than breakdown guarded at the nominal rate"

# Part (ii) of the attainable-retention proposition takes p guard rows. The published
# frontier run used p = 1, guarding free flow alone, and the states nobody named paid
# for the maximisation: recovery retention fell to 0.008 and 0.009 and its loss rose
# from 3.96 and 3.79 to 16.15 MAE. Solving the same programme with free flow, recovery
# and congestion all guarded at the nominal rate returns 0.4344 on both networks, and
# the rounded set attains 0.4343 against an a-priori certificate of 0.00125.
#
# Retention profile at r = 0.1 (nominal is 0.100 for every state, SB then CC):
#
#   method        free          breakdown     recovery      congestion
#   random        0.101 0.101   0.099 0.093   0.098 0.100   0.099 0.098
#   fd_hyb0604    0.086 0.087   0.407 0.419   0.064 0.064   0.094 0.090
#   fd_front10    0.100 0.100   0.523 0.556   0.008 0.009   0.060 0.052
#   fd_front3g    0.100 0.100   0.434 0.434   0.100 0.100   0.100 0.100
#
# fd_front3g dominates fd_hyb0604 on all four coordinates. If retention were the
# currency, it would win at breakdown and give nothing up elsewhere.
#
# State-conditional quantization error says otherwise, and is recorded here before the
# runs (mean over accepted detectors, K50, SB then CC, lower is better coverage):
#
#   method        free          breakdown     recovery      congestion
#   random        0.087 0.080   0.138 0.132   0.275 0.244   0.239 0.215
#   fd_hyb0604    0.091 0.083   0.094 0.093   0.294 0.260   0.245 0.221
#   fd_front3g    0.095 0.086   0.093 0.089   0.326 0.271   0.272 0.229
#   fd_front10    0.099 0.093   0.081 0.078   0.548 0.521   0.502 0.229
#
# fd_front3g holds 0.100 of the recovery pairs against fd_hyb0604's 0.064 and yet
# covers recovery about eleven per cent worse. More of a state and a poorer spread
# within it is the same split the article reports between retention and composition,
# here inside a single state.
#
# Prediction, recorded before the runs. The breakdown loss should land near
# fd_hyb0604's 2.69 and 3.25 MAE, since the two carry almost the same breakdown
# coverage, 0.093 against 0.094. Recovery and congestion should be no better than
# fd_hyb0604's 3.96 and 3.79 and 1.81 and 2.33, and may be slightly worse, following
# the coverage and not the retention. If that holds, dominating every retention
# coordinate buys nothing, and retention is not the currency even when nothing is
# starved. If instead fd_front3g improves on fd_hyb0604 at breakdown while holding the
# other three, the single guard was the whole defect and the frontier is prescriptive
# once every state is named.
#
# Index files are generated by:
#   conda activate cuda && python scripts/analysis/attainable_allocation.py \
#     --ratios 0.1 --taus 0.10 --emit-multi-guard 0.10
# Submission:
#   python experiments/run_experiments.py --cfg experiments/config/fd_frontier_multiguard_r010.yaml --arch=cuda --batch-size 5
# 1 method x 5 architectures x 2 networks = 10 runs.

runs:
  - name: "fd_front3g"
    configs:
      - "baselines/STGCN/SAN_BERNARDINO/SAN_BERNARDINO_no_dropout.py"
      - "baselines/AGCRN/SAN_BERNARDINO/SAN_BERNARDINO.py"
      - "baselines/DCRNN/SAN_BERNARDINO/SAN_BERNARDINO.py"
      - "baselines/STID/SAN_BERNARDINO/SAN_BERNARDINO.py"
      - "baselines/STAEformer/SAN_BERNARDINO/SAN_BERNARDINO.py"
      - "baselines/STGCN/CONTRA_COSTA/CONTRA_COSTA.py"
      - "baselines/AGCRN/CONTRA_COSTA/CONTRA_COSTA.py"
      - "baselines/DCRNN/CONTRA_COSTA/CONTRA_COSTA.py"
      - "baselines/STID/CONTRA_COSTA/CONTRA_COSTA.py"
      - "baselines/STAEformer/CONTRA_COSTA/CONTRA_COSTA.py"
    params:
      CORESET.SELECTION_STRATEGY: ["fd_front3g"]
      CORESET.SELECTION_RATIO: [0.1]
      CORESET.DISTANCE_TYPE: ["euclidean"]
      CORESET.SEED: [42]
      ENV.SEED: [42]
      ENV.DETERMINISTIC: [true]
      ENV.CUDNN.ENABLED: [true]
      ENV.CUDNN.BENCHMARK: [false]
      ENV.CUDNN.DETERMINISTIC: [true]
