description: "The certified frontier set at r=0.1: maximum breakdown retention holding free-flow retention at the nominal rate"

# Proposition 3 certifies the largest breakdown retention a budget of windows admits
# while holding free-flow retention at or above tau.  At tau = 0.10 the linear
# programme gives 0.5230 on San Bernardino and 0.5563 on Contra Costa, and one
# exchange returns a feasible set within 0.00015 and 0.00003 of it, against an
# a-priori certificate width of one window's worth of the state.
#
# That set dominates fd_hyb0604 on both coordinates the split budget is credited with:
#
#   method        free          breakdown     recovery      congestion
#   random        0.101 0.101   0.099 0.093   0.098 0.100   0.099 0.098
#   fd_hyb0604    0.086 0.087   0.407 0.419   0.064 0.064   0.094 0.090
#   fd_front10    0.100 0.100   0.523 0.556   0.008 0.009   0.060 0.052
#
# Recorded before the runs, so the reading is not chosen after the fact.  Maximising
# one state's retention under a free-flow guard starves recovery, whose retention falls
# to 0.008 and 0.009.  The expectation is that the breakdown loss falls below
# fd_hyb0604's 2.69 and 3.25 MAE while the recovery loss rises well above its 3.96 and
# 3.79.  If that holds, the certified frontier is a diagnostic and not a prescription:
# reaching a state's attainable maximum is not what lowers its loss, and splitting the
# budget across states does something the single-state frontier does not.  If instead
# both fall, the frontier is constructive and the split budget is a weaker instance.
#
# Index files are generated by:
#   conda activate cuda && python scripts/analysis/attainable_allocation.py --ratios 0.1 --taus 0.10
# Submission:
#   python experiments/run_experiments.py --cfg experiments/config/fd_frontier_r010.yaml --arch=cuda --batch-size 5
# 1 method x 5 architectures x 2 networks = 10 runs.

runs:
  - name: "fd_front"
    configs:
      - "baselines/STGCN/SAN_BERNARDINO/SAN_BERNARDINO_no_dropout.py"
      - "baselines/AGCRN/SAN_BERNARDINO/SAN_BERNARDINO.py"
      - "baselines/DCRNN/SAN_BERNARDINO/SAN_BERNARDINO.py"
      - "baselines/STID/SAN_BERNARDINO/SAN_BERNARDINO.py"
      - "baselines/STAEformer/SAN_BERNARDINO/SAN_BERNARDINO.py"
      - "baselines/STGCN/CONTRA_COSTA/CONTRA_COSTA.py"
      - "baselines/AGCRN/CONTRA_COSTA/CONTRA_COSTA.py"
      - "baselines/DCRNN/CONTRA_COSTA/CONTRA_COSTA.py"
      - "baselines/STID/CONTRA_COSTA/CONTRA_COSTA.py"
      - "baselines/STAEformer/CONTRA_COSTA/CONTRA_COSTA.py"
    params:
      CORESET.SELECTION_STRATEGY: ["fd_front10"]
      CORESET.SELECTION_RATIO: [0.1]
      CORESET.DISTANCE_TYPE: ["euclidean"]
      CORESET.SEED: [42]
      ENV.SEED: [42]
      ENV.DETERMINISTIC: [true]
      ENV.CUDNN.ENABLED: [true]
      ENV.CUDNN.BENCHMARK: [false]
      ENV.CUDNN.DETERMINISTIC: [true]
