      - "project/adjacency_matrix/configs/MTGNN_CONTRA_COSTA_distance_dense_s42.py"
      - "project/adjacency_matrix/configs/MTGNN_CONTRA_COSTA_distance_dense_s123.py"
      - "project/adjacency_matrix/configs/MTGNN_CONTRA_COSTA_distance_dense_s456.py"
