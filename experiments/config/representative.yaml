description: "Experience Replay"

runs:
  - name: "Replay"
    configs:
      # - "baselines/AGCRN/SAN_BERNARDINO/SAN_BERNARDINO.py"
      # - "baselines/STGCN/SAN_BERNARDINO/SAN_BERNARDINO.py"
      - "baselines/STGformer/SAN_BERNARDINO/SAN_BERNARDINO.py"
      - "baselines/STAEformer/SAN_BERNARDINO/SAN_BERNARDINO.py"
    params:
      EXPERIENCE_REPLAY.METHOD: ["representative"]
      EXPERIENCE_REPLAY.CAPACITY_RATIO: [0.1]
      EXPERIENCE_REPLAY.SEED: [42]
      EXPERIENCE_REPLAY.BATCH_SIZE: [8]
      EXPERIENCE_REPLAY.WEIGHT: [0.1, 0.3, 0.5, 1.0]


  - name: "baseline"
    configs:
      # - "baselines/AGCRN/SAN_BERNARDINO/SAN_BERNARDINO.py"
      # - "baselines/STGCN/SAN_BERNARDINO/SAN_BERNARDINO.py"
      - "baselines/STGformer/SAN_BERNARDINO/SAN_BERNARDINO.py"
      - "baselines/STAEformer/SAN_BERNARDINO/SAN_BERNARDINO.py"