# PEMS-BAY 실험 설정
# 사용법: python experiments/run_experiments.py --config experiments/configs/pems-bay.yaml -g 0

description: "All models on PEMS-BAY dataset"

runs:
  # Hierarchical Split Learning
  - "baselines/HierSplit/staeformer/PEMS-BAY.py"
  #- "baselines/HierSplit/stgformer/PEMS-BAY.py"
  - "baselines/HierSplit/gruseq2seq_graphnet/PEMS-BAY.py"
  
  # Split Learning
  - "baselines/SplitLearning/staeformer/PEMS-BAY.py"
  #- "baselines/SplitLearning/stgformer/PEMS-BAY.py"
  - "baselines/SplitLearning/gruseq2seq_graphnet/PEMS-BAY.py"
  
  # Independent Learning
  - "baselines/IndependentLearning/STAEformer/PEMS-BAY.py"
  - "baselines/IndependentLearning/GRUSeq2SeqWithGraphNet/PEMS-BAY.py"
  
  # Baseline
  - "baselines/STAEformer/PEMS-BAY.py"
  #- "baselines/STGformer/PEMS-BAY.py"
  - "baselines/GRUSeq2SeqWithGraphNet/PEMS-BAY.py"

